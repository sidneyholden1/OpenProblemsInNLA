fidelity:
  divergences: Padded active matrices encode the actual row and column swaps and Schur complements. Rook
    maximality is restricted to the pivot row and column, with all ties. The final result must include
    both original sizes, all intermediate entries and nonempty bounded suprema; no weakened normalized-coordinate
    hypothesis replaces the original target.
