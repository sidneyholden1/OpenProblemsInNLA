  - OpenAI Codex /root, independent AI final referee, nonauthor of IE15 proof
  notes: Both final reviewers are nonauthors. Exact source hashes and reports are retained in reviews/.
    Actual Linux run 35691581091 accepted all four exports with default-kernel replay, standard-three axioms
    and per-project negative/sandbox controls. Original proof-review snapshots remain immutable; metadata
    publication updates do not change mathematical bytes. No human review or endorsement claimed.
