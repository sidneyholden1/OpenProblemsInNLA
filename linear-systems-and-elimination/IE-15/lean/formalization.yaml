fidelity:
  divergences: Padded matrices perform the actual row and column swaps and Schur complements. A proved
    future-permutation transformation transports every arbitrary rook path to diagonal order. Actual sign
    changes and positive scaling produce normalized coordinates and transport every entry back. The source
    scalar monotonicity and separate-convexity steps are replaced by exact algebra and bilinear interpolation.
    The actual last diagonal entry is retained, bounded by one; no replacement assumption is introduced.
    Both original sizes and genuine nonempty bounded real suprema are proved.
