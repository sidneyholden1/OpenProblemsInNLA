status:
  scope: The complete universal orthogonal extremizer equality is disproved at order eight. Four exports
    establish the actual positive-diagonal QR factors, first-available-row pivot paths, every Schur update
    along those paths and strict growth separation, and the original conjecture’s negation using a genuine
    nonempty bounded supremum over all orthogonal inputs and admissible paths. The true supremum is not
    determined. All four exports passed fresh isolated Linux Comparator and default-kernel checks, rejection
    controls, local kernel build, and both independent review phases. Original evidence and independent
    operational audit retained.
  sorry_count: 0
  sorry_in_definitions: 0
  main_results:
