fidelity:
  divergences: Original all-dimensions claim is negated by order eight. One-sided candidate upper and
    witness lower growth bounds suffice; exact source stage-table values and the true orthogonal supremum
    are not advertised. Positive QR and first-tie paths are encoded by their defining properties. Every
    admissible tie path is included in the actual real supremum, with explicit nonempty/bounded-above
    targets.
