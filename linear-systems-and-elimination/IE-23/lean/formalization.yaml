fidelity:
  divergences: Uses the original complex field and actual conjugate transpose and matrix inverse.
    Full row rank is expressed by surjectivity of the matrix map. Actual real supremum ranges over
    all nonzero complex inputs; nonempty and bounded ratio sets are separately proved. The exponent
    p=4 lies in the original open finite range and refutes the full universally quantified implication.
    The source’s stronger all-p norm formula and complete minimizer classification are outside scope.
    No product-objective substitution or endpoint exponent is used.
