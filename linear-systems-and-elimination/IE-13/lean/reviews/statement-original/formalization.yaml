fidelity:
  divergences: The complete canonical unequal-bandwidth target is strengthened to all p,q≥0. Arbitrary
    complex nonsingular matrices, bandwidths at most p,q in the original ordering, all n≥1+max(p,q), all
    actual GEPP ties and all active entries are retained. The sharp value is 1 if p=0 and h(p,p+q) otherwise,
    with the exact source zero-extended recurrence. Actual full rational witness paths and genuine nonempty
    bounded real suprema are conclusions. No front invariant, normalization, pivot admissibility or desired
    scalar bound is assumed. Optional closed-form specializations are not separate advertised results.
