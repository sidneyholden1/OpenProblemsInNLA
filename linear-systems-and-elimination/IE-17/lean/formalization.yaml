fidelity:
  divergences: Exact real arithmetic, zero initial guess, no damping, minimum-length tie convention, fixed
    right-hand side, actual Euclidean operator norm. The spectral backward error is an actual infimum with
    explicit attainment targets. Moore–Penrose identities are explicit targets. A nonstrict lower bound at
    sqrt(99/100) suffices for the strict increase; no stronger source bound is claimed.
