status:
  scope: The complete pair of monotonicity claims is disproved by the exact first two nonzero iterates
    of undamped, zero-initial-guess LSMR on a real 4-by-3 system. The formalization proves the genuine
    minimum-length normal-residual minimizers over the Krylov spaces, the matrix-only spectral backward-error
    infimum and attainment, and the prescribed Moore–Penrose projector approximation. Both errors strictly
    increase; the right-hand side remains fixed. All four exports passed fresh isolated Linux Comparator
    and default-kernel checks, rejection controls, local kernel build, and both independent review phases.
    Original evidence and independent operational audit retained.
