    from proof counts; Solution never imports Challenge.
fidelity:
  divergences: Zero-based finite indices; a single size-three counterexample negates the full original
    universal target. Minimality uses the sufficient general k² rank bound instead of the stronger symmetric
    dimension bound. The congruence determinant identity is proved directly as a polynomial in all nine
    real entries. The genuine quotient has a continuous sign function with exactly two values; no claim
    of exactly two connected components is made.
