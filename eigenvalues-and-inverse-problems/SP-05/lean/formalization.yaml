fidelity:
  divergences: The n² coordinates use Fin n×Fin n in column,row order. Actual commutation and Kronecker
    matrices and Euclidean Rayleigh quotients quantify over every nonzero vector in both sectors; genuine
    infima have proved nonempty, bounded and attained obligations. The source PSD minimizing eigenmatrix
    is proved. Its integral argument for inverse positivity is replaced by an exact negative-eigenpair
    contradiction for the Sylvester operator and an invertible congruence. The actual nonsingular inverse,
    CFC positive/negative parts, spectral maximum and reciprocal eigenvalue lower bound are derived rather
    than assumed. Complex PSD minimizers return to real PSD matrices via real parts and positive trace.
