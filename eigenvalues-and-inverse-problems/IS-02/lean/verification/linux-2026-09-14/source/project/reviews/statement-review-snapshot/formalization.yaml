fidelity:
  divergences: Order four refutes the original all-dimensions implication. Equal actual characteristic
    polynomials encode equal eigenvalues with algebraic multiplicities; simultaneous Equiv.Perm submatrix
    reindexing encodes permutation similarity. Actual real segments and extreme points include all endpoints
    and every vertex. The finite algebra proof replaces the source graph argument without restricting
    competing matrices.
