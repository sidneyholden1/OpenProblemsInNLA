fidelity:
  divergences: Zero-based finite indices. Components use Mathlib connectedComponentIn and Set.encard,
    including infinite cardinality. Eigenvalues are defined by actual nonzero real eigenvectors.
    The determinant-range step is replaced by direct elimination of eigenvector equations, with the
    same parameter bounds and separators. No symmetry or spectral assumption is added. At least four
    components are proved; exact endpoints and exact component count are not asserted.
