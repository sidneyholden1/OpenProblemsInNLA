status:
  scope: The complete original odd-summand conjecture is proved and, more strongly, the sharp additive
    contraction constant is k/4 for every k≥2. The formalization uses the actual complex Euclidean operator
    norm, positive square-root matrix modulus and positive-semidefinite order, with genuine infima of
    nonempty sets bounded below and exact dimension-two extremizers. All four exports passed fresh isolated
    Linux Comparator and default-kernel checks, rejection controls, local kernel build, and both independent
    review phases. Original evidence and independent operational audit retained.
