fidelity:
  divergences: Stronger all-k≥2 equality implies complete original odd-k≥3 target. Zero-based finite indexing.
    Genuine real infimum with separate nonempty and bounded-below assertions. Optional Hermitian 3×3 extremizers
    are not advertised. Exact phase families with zero sum may replace exponential coordinates without
    changing mathematical targets.
