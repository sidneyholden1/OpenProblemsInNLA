status:
  scope: The fixed-list feasibility characterization by rectangular sign matrices is proved for every
    positive dimension and row count. The rank and divisibility obstructions and an explicit order-twelve
    sign matrix establish that the actual minimum fixed pinching length is 12 for every dimension from
    9 through 12. The source’s adaptive comparison is not formalized, and the all-dimension optimum remains
    open. All four exports passed fresh isolated Linux Comparator and default-kernel checks, rejection
    controls, local kernel build, and both independent review phases. Original evidence and independent
    operational audit retained.
  sorry_count: 0
  sorry_in_definitions: 0
  main_results:
