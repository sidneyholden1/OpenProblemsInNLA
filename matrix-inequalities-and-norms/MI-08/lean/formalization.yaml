fidelity:
  divergences: Fixed-list feasibility for every positive dimension and row count; exact minima only in
    dimensions 9–12. Integer signs represent the same real ±1 values. Adaptive comparison excluded; no
    all-dimension optimum claimed. Actual feasible-set nonemptiness and leastness prevent empty-infimum
    artifacts.
review:
  status: statement-and-proof-agent-reviewed; isolated-linux-verified
  reviewers:
  - OpenAI Codex agent /root/iv06_statement_referee_1
  - OpenAI Codex agent /root/iv06_statement_referee_2
  notes: Both independent statement reviews passed before proof implementation; both independent final
    reviewers replayed the proof and checked its full declared scope, source hashes and all four exported
    axiom closures. Actual isolated Linux Comparator/default-kernel verification and rejection controls
    passed at a66e142cbe7907db6594ef57c7f542c3d33ad704 in run 34862187226. The original artifact, exact
    tested inputs and independent operational PASS report are retained in verification/linux-2026-09-14.
    Historical statement and proof-review metadata remain unchanged in their archived snapshots. No human
    review or author endorsement is asserted. The verified scope is explicitly partial; adaptive comparison
    and the all-dimension optimum are excluded.
