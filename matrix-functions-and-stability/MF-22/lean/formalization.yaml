fidelity:
  divergences: No target weakening. Fin n × Fin 2 indexes the exact 2n coordinates (j,a) ↔ 2j+a. Both
    matrix norms are genuine induced Euclidean norms; inverse is the actual matrix inverse. The extended
    condition number is infinity for singular matrices. All rho>0, including rho=sqrt(10), and all sufficiently
    large integer n are retained. Constants may depend on rho but not n; no uniform-in-rho or small-size
    assertion. The source linear bound strengthens the original unspecified polynomial exponent. Root/spectral/transfer
    assertions are obligations, not public assumptions.
