fidelity:
  divergences: Fixed λ=1/4 suffices for every fractional exponent; literal source six-dimensional pair
    is retained. All words use actual Euclidean operator norms. The finite-family supremum must be an
    attained greatest element, and the actual nth-root limit must be one. Integer exponents and zero are
    included; matrices/dimension/constants cannot depend on length. Rational-entry and optimal-dimension
    refinements are excluded. Integer extension uses repeated fixed two-dimensional Jordan tensor factors
    instead of a single optimal-size Jordan block. This changes only unadvertised dimension efficiency;
    all real exponents, all lengths and actual L2 norms remain. Exact entrywise norm comparisons avoid
    an unnecessary spectral tensor-norm equality. LeanCert supplies kernel trust audits; no artificial
    interval calculation.
