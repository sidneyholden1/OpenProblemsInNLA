    consumers and LeanCert kernel checks pass. Immutable proof 1231b92f2b0235559e5fe5162f6b76d21249ffd0;
    Linux run 35696246513, attempt 2. The initial attempt was canceled at a pause request, not accepted.
    Independent nonauthor operational audit verifies all source hashes, default-kernel and negative/sandbox
    controls. Reviewed documentation snapshots retained. No external human review claimed.
