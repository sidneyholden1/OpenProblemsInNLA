fidelity:
  divergences: Finite straight-line register histories include arbitrary stored-value reuse and all free
    real linear combinations. Every actual error is a real supremum on both closed gap intervals; their
    nonempty bounded attained nature is a required export. Program/composition errors are real infima
    with explicit nonempty bounded obligations. The natural least stage is used only with a required feasible-set
    nonemptiness/minimality proof, so empty-infimum fallback cannot prove the target. Uniform bounds cover
    every gap and multiplication budget, including zero and one; no finite samples or abstract assumed
    approximation bounds.
